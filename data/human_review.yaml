# Human review register (README: Responsible design -> Human review).
#
# Every manual correction to the compiled coverage (resolver/compile_exemptions.py) is recorded
# here and nowhere else. compile_exemptions.apply_reviews() applies the entries after assembly and
# refuses an entry whose quoted_span is not found VERBATIM in the rule's own exported text
# (coverage notes / coverage text / exemptions), so every correction stays tied to the source.
#
#   id:           HR-NNN (never reused)
#   rule_id:      team_rule_id in out/rules.json
#   action:       set_scope (kind + scope: rescope every compiled item of that kind)
#                 add_item  (kind + predicate: add an item the compiler missed)
#   quoted_span:  verbatim text of the rule that supports the decision
#   reason:       why
#   reviewer:     who decided (role, not a personal name)
#   date:         ISO date of the decision
#
# New documents added in incremental mode (extract-doc, hour 16) never need an entry here: the
# register only corrects already-reviewed rules (tests/test_human_review.py).

reviews:
  - id: HR-001
    rule_id: MA-RENT-01
    action: set_scope
    kind: exemption
    scope: other_law
    quoted_span: "Permitted local rent control may not apply to units owned by a person or entity owning less than ten rental units, or to units with a fair market rent exceeding $400."
    reason: >-
      M.G.L. c. 40P bars local rent control; these limits describe when a permitted local regulation
      may not apply, which only matters in a municipality that accepted chapter 40P. They depend on
      another law, not on the building.
    reviewer: "project team (B2 decision)"
    date: "2026-10-03"

  - id: HR-002
    rule_id: CA-DEP-06
    action: add_item
    kind: condition
    predicate: {"fact": "units", "op": "<=", "value": 4}
    quoted_span: "The landlord must own no more than two residential rental properties with no more than four dwelling units offered for rent in total."
    reason: >-
      The small-landlord two-months rule is limited to landlords with no more than four units in total;
      the compiler returned no item for it. A building's units are a lower bound of the landlord's
      total, so a building with more than four units refutes it. Same restriction as CA-DEP-02
      (units_max 4, same law).
    reviewer: "project team (B3 decision; proposed by the coding assistant in the SF self-check)"
    date: "2026-10-03"
