# Reviewer decisions applied by resolver/compile_exemptions.py after assembly. Each entry sets
# the scope of every compiled item of `kind` in `rule_id`. Keep only decisions taken by the team
# after reviewing data/compiled_exemptions_review.md, with the reason.

overrides:
  - rule_id: MA-RENT-01
    kind: exemption
    scope: other_law
    reason: >-
      Team decision B2 (2026-10-03): M.G.L. c. 40P bars local rent control; its "exemptions"
      (owners of fewer than ten units, fair market rent above $400) describe when a permitted
      local regulation may not apply, which only matters in a municipality that accepted
      chapter 40P. They depend on another law, not on the building.
