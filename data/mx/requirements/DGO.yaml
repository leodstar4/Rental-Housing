# Requisitos DGO — citas literales verificadas contra corpus_mx/estados/DGO (ver corpus_mx/manifest_estados.json).
# No es asesoría legal.
- id: MX-DGO-FORMA-01
  jurisdiction: DGO
  category: contrato_forma
  kind: ley
  title_es: Contrato por escrito si la renta pasa de cien pesos anuales
  title_en: Written contract if rent exceeds one hundred pesos per year
  summary_es: El arrendamiento debe otorgarse por escrito cuando la renta pase de cien pesos anuales.
  summary_en: The lease must be in writing when the rent exceeds one hundred pesos per year.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2287
  quote: El arrendamiento debe otorgarse por escrito cuando la renta pase de cien pesos anuales.
  applies_to_contract: true
- id: MX-DGO-DURACION-01
  jurisdiction: DGO
  category: duracion
  kind: ley
  title_es: 'Plazo máximo: diez años para habitación'
  title_en: 'Maximum term: ten years for housing'
  summary_es: El arrendamiento no puede exceder de diez años para las fincas destinadas a habitación, de quince para comercio y de veinte para industria.
  summary_en: A lease may not exceed ten years for property used as housing, fifteen for commercial use and twenty for industrial use.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2279, párr. segundo
  quote: El arrendamiento no puede exceder de diez años para las fincas destinadas a habitación, de quince para las fincas destinadas al comercio y de veinte para las finas (sic) destinadas al ejercicio de una industria.
  applies_to_contract: true
- id: MX-DGO-SUBROGACION-01
  jurisdiction: DGO
  category: terminacion
  kind: ley
  title_es: No se rescinde por muerte de las partes
  title_en: Not rescinded by death of a party
  summary_es: El contrato de arrendamiento no se rescinde por la muerte del arrendador ni del arrendatario, salvo convenio en otro sentido.
  summary_en: The lease is not rescinded by the death of the landlord or tenant, unless otherwise agreed.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2289
  quote: El contrato de arrendamiento no se rescinde por la muerte del arrendador ni del arrendatario, salvo convenio en otro sentido.
  applies_to_contract: true
- id: MX-DGO-ARRENDADOR-01
  jurisdiction: DGO
  category: obligaciones_arrendador
  kind: ley
  title_es: Entregar en estado de servir y conservar con reparaciones
  title_en: Deliver fit for use and maintain with repairs
  summary_es: Aun sin pacto expreso, el arrendador debe entregar la finca con sus pertenencias y en estado de servir para el uso convenido, y conservarla en el mismo estado durante el arrendamiento haciendo todas las reparaciones necesarias.
  summary_en: Even without an express agreement, the landlord must deliver the property with its appurtenances and fit for the agreed use, and keep it in that condition during the lease making all necessary repairs.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2293, fracc. I y II
  quote: 'El arrendador está obligado, aunque no haya pacto expreso: I.- A entregar al arrendatario la finca arrendada con todas sus pertenencias y en estado de servir para el uso convenido; y si no hubo convenio expreso, para aquel a que por su misma naturaleza estuviere destinada. II.- A conservar la cosa arrendada en el mismo estado, durante el arrendamiento, haciendo para ello todas las reparaciones necesarias;'
  applies_to_contract: true
- id: MX-DGO-ARRENDATARIO-01
  jurisdiction: DGO
  category: obligaciones_arrendatario
  kind: ley
  title_es: Pagar renta, responder de daños y uso convenido
  title_en: Pay rent, answer for damage, agreed use
  summary_es: El arrendatario debe pagar la renta en la forma y tiempo convenidos, responder de los perjuicios que sufra la cosa por su culpa o negligencia o la de sus familiares, sirvientes o subarrendatarios, y usarla solo para el uso convenido o conforme a su naturaleza y destino.
  summary_en: The tenant must pay rent in the agreed form and time, answer for harm to the property caused by their fault or negligence or that of family, servants or subtenants, and use it only for the agreed use or according to its nature and purpose.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2306, fracc. I a III
  quote: 'El arrendatario está obligado: I.- A satisfacer la renta en la forma y tiempo convenidos; II.- A responder de los perjuicios que la cosa arrendada sufra por su culpa o negligencia, la de sus familiares, sirvientes o subarrendatarios; III.- A servirse de la cosa solamente para el uso convenido o conforme a la naturaleza y destino de ella.'
  applies_to_contract: true
- id: MX-DGO-ARRENDATARIO-02
  jurisdiction: DGO
  category: obligaciones_arrendatario
  kind: ley
  title_es: La renta corre desde la entrega del inmueble
  title_en: Rent runs from delivery of the property
  summary_es: El arrendatario no está obligado a pagar la renta sino desde el día en que recibe la cosa arrendada, salvo pacto en contrario.
  summary_en: The tenant is not obliged to pay rent until the day the leased property is received, unless otherwise agreed.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2307
  quote: El arrendatario no está obligado a pagar la renta sino desde el día en que reciba la cosa arrendada salvo pacto en contrario.
  applies_to_contract: true
- id: MX-DGO-ARRENDATARIO-03
  jurisdiction: DGO
  category: obligaciones_arrendatario
  kind: ley
  title_es: Avisar la necesidad de reparaciones
  title_en: Notify the need for repairs
  summary_es: El arrendatario está obligado a poner en conocimiento del arrendador, a la brevedad posible, la necesidad de las reparaciones, bajo pena de pagar los daños y perjuicios que su omisión cause.
  summary_en: The tenant must inform the landlord, as soon as possible, of the need for repairs, under penalty of paying the damages caused by their omission.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2296
  quote: El arrendatario está obligado a poner en conocimiento del arrendador, a la brevedad posible la necesidad de las reparaciones, bajo pena de pagar los daños y perjuicios que su omisión cause.
  applies_to_contract: true
- id: MX-DGO-HABITABILIDAD-01
  jurisdiction: DGO
  category: habitabilidad
  kind: ley
  title_es: Condiciones de higiene y salubridad
  title_en: Hygiene and sanitation conditions
  summary_es: No puede darse en arrendamiento una localidad que no reúna las condiciones de higiene y salubridad exigidas en el Código Sanitario.
  summary_en: A dwelling that does not meet the hygiene and sanitation conditions required by the Sanitary Code may not be leased.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2329
  quote: No podrá darse en arrendamiento una localidad que no reúna las condiciones de higiene y salubridad exigidas en el Código Sanitario.
  applies_to_contract: true
- id: MX-DGO-SUBARRIENDO-01
  jurisdiction: DGO
  category: obligaciones_arrendatario
  kind: ley
  title_es: Subarriendo requiere consentimiento
  title_en: Subletting requires consent
  summary_es: El arrendatario no puede subarrendar la cosa en todo ni en parte, ni ceder sus derechos, sin consentimiento del arrendador; si lo hace, responde solidariamente con el subarrendatario de los daños y perjuicios.
  summary_en: The tenant may not sublet all or part, nor assign their rights, without the landlord's consent; otherwise they are jointly liable with the subtenant for damages.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2361
  quote: El arrendatario no puede subarrendar la cosa arrendada en todo, ni en parte, ni ceder sus derechos sin consentimiento del arrendador; si no (sic) hiciere, responderá solidariamente con el subarrendatario, de los daños y perjuicios.
  applies_to_contract: true
- id: MX-DGO-TERMINACION-01
  jurisdiction: DGO
  category: terminacion
  kind: ley
  title_es: Modos de terminar el arrendamiento
  title_en: Ways the lease ends
  summary_es: El arrendamiento puede terminar, entre otras causas, por haberse cumplido el plazo fijado en el contrato o por la ley, por convenio expreso, por nulidad y por rescisión.
  summary_en: The lease may end, among other causes, by expiry of the term set in the contract or by law, by express agreement, by nullity, and by rescission.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2364, fracc. I a IV
  quote: 'El arrendamiento puede terminar: I.- Por haberse cumplido el plazo fijado en el contrato o por la ley, o por estar satisfecho el objeto para que la cosa fué arrendada; II.- Por convenio expreso; III.- Por nulidad; IV.- Por rescisión;'
  applies_to_contract: true
- id: MX-DGO-TERMINACION-02
  jurisdiction: DGO
  category: terminacion
  kind: ley
  title_es: 'Plazo determinado: concluye sin necesidad de desahucio'
  title_en: 'Fixed term: ends without eviction notice'
  summary_es: Si el arrendamiento se hizo por tiempo determinado, concluye el día precisado sin necesidad de desahucio.
  summary_en: If the lease was made for a fixed term, it ends on the set day without the need for an eviction notice.
  doc_id: D-MX-DGO-01
  citation: Código Civil del Estado de Durango, art. 2365, párr. primero
  quote: Si el arrendamiento se ha hecho por tiempo determinado, concluye en el día precisado sin necesidad de desahucio.
  applies_to_contract: true
